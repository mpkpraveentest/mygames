<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mickey Mouse III - Yume Fuusen (Japan) - Embedded NES</title>
<style>
  :root {
    --bg:#07080d; --panel:#111522; --btn:#20283b; --btn2:#2e3850; --text:#f5f7ff; --muted:#9ca7c0;
    --accent:#7dd3fc; --danger:#ff718d;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  body { touch-action:none; overscroll-behavior:none; }
  #app { height:100dvh; width:100vw; display:grid; grid-template-rows:auto 1fr auto; gap:6px; padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left)); }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:36px; }
  h1 { margin:0; font-size:clamp(13px, 2.7vw, 18px); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topBtns { display:flex; gap:6px; align-items:center; }
  button { border:0; border-radius:12px; padding:9px 11px; background:var(--btn); color:var(--text); font-weight:700; cursor:pointer; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  button:active, .touchBtn.active { transform:scale(.96); background:var(--btn2); }
  #status { font-size:12px; color:var(--muted); min-width:8em; text-align:right; }
  #playfield { position:relative; min-height:0; border-radius:18px; background:radial-gradient(circle at 50% 35%, #171d2d, #05060a 72%); display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.08); }
  #screenWrap { position:relative; width:min(100%, calc((100dvh - 132px) * 1.333)); max-width:100%; aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; }
  canvas, #emulatorjs { width:100%; height:100%; image-rendering:pixelated; background:#000; border-radius:10px; }
  #emulatorjs { display:none; }
  #overlay { position:absolute; inset:auto 10px 10px 10px; background:rgba(0,0,0,.58); border-radius:12px; padding:8px 10px; color:#fff; font-size:12px; text-align:center; pointer-events:none; }
  footer { position:relative; min-height:72px; }
  .mobileControls { position:absolute; inset:0; display:none; pointer-events:none; }
  .touchBtn { pointer-events:auto; user-select:none; touch-action:none; display:flex; align-items:center; justify-content:center; background:rgba(32,40,59,.72); border:1px solid rgba(255,255,255,.16); color:#fff; font-weight:900; box-shadow:0 6px 18px rgba(0,0,0,.32); }
  .dpad { position:absolute; left:clamp(8px, 2.4vw, 18px); bottom:0; width:150px; height:112px; max-width:34vw; }
  .dpad .touchBtn { position:absolute; width:48px; height:48px; border-radius:15px; }
  .up { left:51px; top:0; } .down { left:51px; bottom:0; } .left { left:0; top:32px; } .right { right:0; top:32px; }
  .actions { position:absolute; right:clamp(8px, 2.4vw, 18px); bottom:12px; width:150px; height:86px; max-width:34vw; }
  .actions .touchBtn { position:absolute; width:60px; height:60px; border-radius:50%; font-size:20px; }
  .btnB { left:0; bottom:0; } .btnA { right:0; top:0; background:rgba(180,45,70,.72); }
  .centerKeys { position:absolute; left:50%; transform:translateX(-50%); bottom:14px; display:flex; gap:10px; align-items:center; justify-content:center; }
  .centerKeys .touchBtn { min-width:62px; height:34px; border-radius:999px; font-size:11px; padding:0 10px; }
  #help { font-size:11px; color:var(--muted); text-align:center; padding-top:4px; }
  @media (pointer:coarse), (max-width: 820px) {
    #app { grid-template-rows:auto 1fr 122px; }
    .mobileControls { display:block; }
    #screenWrap { width:min(100%, calc((100dvh - 184px) * 1.333)); }
    #help { display:none; }
  }
  @media (orientation:landscape) and (pointer:coarse) {
    #app { grid-template-rows:auto 1fr; }
    footer { position:fixed; inset:0; pointer-events:none; min-height:0; }
    .mobileControls { display:block; }
    #screenWrap { width:min(58vw, calc((100dvh - 54px) * 1.333)); }
    .dpad { bottom:max(12px, env(safe-area-inset-bottom)); }
    .actions { bottom:max(20px, env(safe-area-inset-bottom)); }
    .centerKeys { bottom:max(18px, env(safe-area-inset-bottom)); }
  }
  :fullscreen #app { height:100dvh; }
  :fullscreen header { min-height:34px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Mickey Mouse III - Yume Fuusen (Japan)</h1>
    <div class="topBtns"><button id="startBtn">Start game</button><button id="fsBtn">Fullscreen</button><span id="status">Ready</span></div>
  </header>
  <main id="playfield">
    <div id="screenWrap">
      <canvas id="screen" width="256" height="240"></canvas>
      <div id="emulatorjs"></div>
      <div id="overlay">Click “Start game”. Keyboard: Arrows, Z=A, X=B, Enter=Start, Shift=Select, F=Fullscreen.</div>
    </div>
  </main>
  <footer>
    <div id="help">Keyboard: Arrows move • Z=A • X=B • Enter=Start • Shift=Select • F=Fullscreen</div>
    <div class="mobileControls" aria-hidden="true">
      <div class="dpad">
        <div class="touchBtn up" data-key="up">▲</div><div class="touchBtn down" data-key="down">▼</div><div class="touchBtn left" data-key="left">◀</div><div class="touchBtn right" data-key="right">▶</div>
      </div>
      <div class="centerKeys"><div class="touchBtn" data-key="select">SELECT</div><div class="touchBtn" data-key="start">START</div></div>
      <div class="actions"><div class="touchBtn btnB" data-key="b">B</div><div class="touchBtn btnA" data-key="a">A</div></div>
    </div>
  </footer>
</div>

const GAME_NAME = "Mickey Mouse III - Yume Fuusen (Japan)";
const statusEl = document.getElementById('status');
const overlay = document.getElementById('overlay');
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
let nes = null, usingJSNES = false, imageData = ctx.getImageData(0,0,256,240), audioCtx, scriptNode;
let framebuffer = new Uint8ClampedArray(256*240*4);

function setStatus(t) { statusEl.textContent = t; }
function base64ToBinaryString(b64) {
  const bin = atob(b64); return bin;
}
function base64ToBlobUrl(b64) {
  const bin = atob(b64); const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);

function loadScript(src) { return new Promise((res, rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function toggleFullscreen() {
  const el = document.documentElement;
  try {
    if (!document.fullscreenElement) await el.requestFullscreen?.(); else await document.exitFullscreen?.();
  } catch(e) { console.warn(e); }
}
document.getElementById('fsBtn').addEventListener('click', toggleFullscreen);
document.addEventListener('keydown', e=>{ if(e.key && e.key.toLowerCase()==='f') { e.preventDefault(); toggleFullscreen(); } });
function pressNES(key, down) {
  if (usingJSNES && nes && window.jsnes && jsnes.Controller) {
    const c=jsnes.Controller;
    const m={left:c.BUTTON_LEFT,right:c.BUTTON_RIGHT,up:c.BUTTON_UP,down:c.BUTTON_DOWN,a:c.BUTTON_A,b:c.BUTTON_B,select:c.BUTTON_SELECT,start:c.BUTTON_START};

window.addEventListener('keydown', e=>{
  if(!usingJSNES || !nes || !window.jsnes) return;
  const rev={37:'left',38:'up',39:'right',40:'down',90:'a',88:'b',16:'select',13:'start'}[e.keyCode];
  if(rev) { e.preventDefault(); pressNES(rev,true); }
});
window.addEventListener('keyup', e=>{
  if(!usingJSNES || !nes || !window.jsnes) return;
  const rev={37:'left',38:'up',39:'right',40:'down',90:'a',88:'b',16:'select',13:'start'}[e.keyCode];
  if(rev) { e.preventDefault(); pressNES(rev,false); }
});

function setupAudio() {

    scriptNode.onaudioprocess = e => {
      const l=e.outputBuffer.getChannelData(0), r=e.outputBuffer.getChannelData(1);

async function startJSNES() {

async function startEmulatorJS() {
