<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Super Spike V'Ball - NES Emulator</title>
<style>
  :root { --bg:#050509; --panel:#101018; --line:#2d2d48; --accent:#00e5ff; --accent2:#ff2dd8; --text:#fff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text); font-family:system-ui,Segoe UI,Arial,sans-serif; }
  body { touch-action:none; }
  #app { position:fixed; inset:0; display:grid; grid-template-rows:auto 1fr; background:radial-gradient(circle at 50% 0%, #1a1840 0%, #050509 55%); }
  header { min-height:44px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); background:rgba(0,0,0,.35); }
  .title { font-weight:800; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hint { opacity:.75; font-size:12px; }
  button { border:2px solid var(--accent); color:#fff; background:#151529; border-radius:999px; padding:8px 12px; font-weight:800; cursor:pointer; }
  #stage { position:relative; min-height:0; display:grid; place-items:center; padding:8px clamp(92px, 18vw, 180px); }
  #screenWrap { position:relative; width:min(calc(100vw - clamp(184px, 36vw, 360px)), calc((100vh - 64px) * 4 / 3)); max-width:100%; aspect-ratio:4/3; border:3px solid #fff; border-radius:14px; overflow:hidden; background:#000; box-shadow:0 0 32px rgba(0,229,255,.25); }
  canvas, #emulatorjs { width:100%; height:100%; display:block; image-rendering:pixelated; background:#000; }
  #status { position:absolute; inset:auto 10px 10px 10px; z-index:5; padding:8px 10px; border-radius:10px; background:rgba(0,0,0,.65); color:#fff; font-size:12px; text-align:center; }
  .controls { position:absolute; inset:0; pointer-events:none; z-index:10; }
  .leftPad, .rightPad { position:absolute; top:50%; transform:translateY(-50%); pointer-events:auto; }
  .leftPad { left:max(10px, env(safe-area-inset-left)); width:132px; height:132px; }
  .rightPad { right:max(10px, env(safe-area-inset-right)); width:150px; height:150px; display:grid; grid-template-columns:repeat(2, 1fr); grid-template-rows:repeat(2, 1fr); gap:12px; align-items:center; justify-items:center; }
  .dkey, .face, .smallBtn { position:absolute; display:grid; place-items:center; border:2px solid rgba(255,255,255,.75); background:rgba(255,255,255,.13); color:#fff; font-weight:900; backdrop-filter:blur(6px); box-shadow:inset 0 0 20px rgba(255,255,255,.08); }
  .dkey { width:46px; height:46px; border-radius:14px; }
  .up { left:43px; top:0; } .down { left:43px; bottom:0; } .left { left:0; top:43px; } .right { right:0; top:43px; }
  .stickCore { position:absolute; left:43px; top:43px; width:46px; height:46px; border-radius:50%; background:rgba(0,229,255,.25); border:2px solid rgba(0,229,255,.8); }
  .face { position:static; width:62px; height:62px; border-radius:50%; font-size:22px; }
  .a { background:rgba(255,45,216,.28); border-color:#ff8bee; grid-column:2; grid-row:1; }
  .b { background:rgba(0,229,255,.25); border-color:#83f2ff; grid-column:1; grid-row:2; }
  .smallBtn { width:58px; height:34px; border-radius:999px; font-size:11px; }
  .select { grid-column:1; grid-row:1; align-self:end; } .start { grid-column:2; grid-row:2; align-self:start; }
  .pressed { transform:scale(.92); filter:brightness(1.5); }
  #fallbackFrame { position:absolute; inset:0; width:100%; height:100%; border:0; display:none; }
  @media (pointer:fine) and (min-width:900px) { .controls { opacity:.35; } .controls:hover { opacity:1; } }
  @media (max-width:720px) {
    header { min-height:38px; padding:6px 8px; } .hint { display:none; } button { padding:7px 10px; font-size:12px; }
    #stage { padding:4px 82px; } #screenWrap { width:min(calc(100vw - 164px), calc((100vh - 46px) * 4 / 3)); border-width:2px; border-radius:10px; }
    .leftPad { width:116px; height:116px; } .dkey { width:42px; height:42px; } .up { left:37px; } .down { left:37px; } .left,.right { top:37px; } .stickCore { left:37px; top:37px; width:42px; height:42px; }
    .rightPad { width:128px; height:128px; gap:8px; } .face { width:54px; height:54px; font-size:19px; } .smallBtn { width:50px; height:30px; font-size:10px; }
  }
  @media (orientation:portrait) {
    #app { grid-template-rows:auto 1fr 145px; } #stage { padding:8px; align-items:center; } #screenWrap { width:min(96vw, calc((100vh - 210px) * 4 / 3)); }
    .controls { position:relative; height:145px; grid-row:3; } .leftPad { left:16px; } .rightPad { right:16px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div><div class="title">Super Spike V'Ball</div><div class="hint">Keyboard: Arrows, Z=A, X=B, Enter=Start, Shift=Select, F=Fullscreen</div></div>
    <button id="fsBtn">Fullscreen</button>
  </header>
  <main id="stage">
    <div id="screenWrap">
      <canvas id="nesCanvas" width="256" height="240"></canvas>
      <div id="emulatorjs"></div>
      <div id="status">Loading JSNES...</div>
    </div>
  </main>
  <div class="controls" aria-label="Mobile controls">
    <div class="leftPad">
      <div class="stickCore"></div>
      <div class="dkey up" data-btn="UP">▲</div><div class="dkey down" data-btn="DOWN">▼</div><div class="dkey left" data-btn="LEFT">◀</div><div class="dkey right" data-btn="RIGHT">▶</div>
    </div>
    <div class="rightPad">
      <div class="smallBtn select" data-btn="SELECT">SELECT</div><div class="smallBtn start" data-btn="START">START</div>
      <div class="face b" data-btn="B">B</div><div class="face a" data-btn="A">A</div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/jsnes/dist/jsnes.min.js"></script>

  const root = document.documentElement;

  else (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen)?.call(document);
}
document.getElementById('fsBtn').addEventListener('click', toggleFullscreen);
function startEmulatorJSFallback() {
  setStatus('JSNES failed. Loading EmulatorJS fallback...');
  canvas.style.display = 'none';
  const data = Uint8Array.from(atob(ROM_B64), c => c.charCodeAt(0));
  const blob = new Blob([data], {type:'application/octet-stream'});
  window.EJS_player = '#emulatorjs';
  window.EJS_core = 'nes';
  window.EJS_gameName = 'Super Spike VBall';
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_gameUrl = URL.createObjectURL(blob);
  window.EJS_startOnLoaded = true;
  const s = document.createElement('script');
  s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
  s.onerror = () => setStatus('Could not load JSNES or EmulatorJS. Use a browser with internet for emulator scripts.');
  document.body.appendChild(s);
}
window.addEventListener('error', e => { if (!running) startEmulatorJSFallback(); }, {once:true});
try { startJSNES(); } catch (e) { console.error(e); startEmulatorJSFallback(); }
document.addEventListener('click', startAudio, {once:true});
document.addEventListener('touchstart', startAudio, {once:true, passive:false});
</script>
