<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05050b" />
<title>Nokia Pacman - Web Edition</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap" id="gameShell">
    <header class="topbar">
      <h1>Nokia Pacman</h1>
      <div class="hud" aria-label="Game status">
        <span>Score <b id="score">0</b></span>
        <span>Lives <b id="lives">3</b></span>
        <span>Level <b id="level">1</b></span>
      </div>
    </header>

    <section class="gameArea" aria-label="Pacman play area">
      <canvas id="game" width="456" height="552" aria-label="Pacman web game"></canvas>
    </section>

    <p id="message">Press Space or tap Start. Use arrow keys, WASD, touch buttons, or swipe.</p>

    <div class="buttons">
      <button id="startBtn" type="button">Start / Pause</button>
      <button id="restartBtn" type="button">Restart</button>
      <button id="fullscreenBtn" type="button">Fullscreen</button>
    </div>

    <div class="dpad" aria-label="Touch controls">
      <button data-dir="up" type="button" aria-label="Move up">▲</button>
      <button data-dir="left" type="button" aria-label="Move left">◀</button>
      <button data-dir="down" type="button" aria-label="Move down">▼</button>
      <button data-dir="right" type="button" aria-label="Move right">▶</button>
    </div>
  </main>
<script src="app.js"></script>
</body>
</html>
