<!DOCTYPE html>
<html>
<head>
    <title>Snake Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #123c1d;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            background: #3f8f36;
            overflow: hidden;
        }
        #game-area {
            position: relative;
            width: 100%;
            height: 100%;
            background: #3f8f36;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #3f8f36;
            touch-action: none;
        }
        #score-display, #highscore-display {
            position: absolute;
            top: 14px;
            font-size: clamp(16px, 2.2vw, 24px);
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 3px rgba(0,0,0,0.65);
            pointer-events: none;
        }
        #score-display { left: 16px; }
        #highscore-display { right: 16px; color: gold; }
        #game-over, #start-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background-color: rgba(0, 0, 0, 0.72);
            padding: 22px;
            border-radius: 12px;
            width: min(82%, 680px);
            font-weight: bold;
            z-index: 4;
        }
        #game-over {
            font-size: clamp(26px, 5vw, 42px);
            color: red;
            display: none;
        }
        #start-message {
            font-size: clamp(17px, 3vw, 26px);
            color: white;
        }
        #controls {
            position: absolute;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            padding: 8px 10px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.42);
            z-index: 5;
        }
        #controls button, #controls select {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        #controls button {
            background-color: #1f7f2a;
            color: white;
        }
        #controls button:hover { background-color: #166320; }
        #game-speed { background: white; color: #111; }
        #mobile-controls {
            display: none;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, minmax(54px, 1fr));
            grid-template-rows: repeat(3, minmax(42px, 1fr));
            gap: 8px;
            width: min(72vw, 320px);
            margin: 0 auto;
        }
        .dpad button, .mobile-action-row button {
            border: none;
            border-radius: 12px;
            background: #1f7f2a;
            color: white;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 4px 0 #0d4716;
            touch-action: manipulation;
            user-select: none;
        }
        .dpad button[data-dir] {
            position: relative;
            font-size: 0;
        }
        .dpad button[data-dir]::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
            transform: translate(-50%, -50%);
        }
        .mobile-up::before {
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-bottom: 28px solid white;
        }
        .mobile-down::before {
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 28px solid white;
        }
        .mobile-left::before {
            border-top: 18px solid transparent;
            border-bottom: 18px solid transparent;
            border-right: 28px solid white;
        }
        .mobile-right::before {
            border-top: 18px solid transparent;
            border-bottom: 18px solid transparent;
            border-left: 28px solid white;
        }
        .dpad button:active, .mobile-action-row button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0d4716;
        }
        .mobile-up { grid-column: 2; grid-row: 1; }
        .mobile-left { grid-column: 1; grid-row: 2; }
        .mobile-center { grid-column: 2; grid-row: 2; font-size: 14px !important; }
        .mobile-right { grid-column: 3; grid-row: 2; }
        .mobile-down { grid-column: 2; grid-row: 3; }
        .mobile-action-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .mobile-action-row button {
            min-height: 40px;
            padding: 8px 14px;
            font-size: 14px;
        }
        @media (hover: none), (pointer: coarse), (max-width: 768px) {
            body { align-items: stretch; }
            #game-container {
                display: flex;
                flex-direction: column;
            }
            #game-area {
                height: 70vh;
                flex: 0 0 70vh;
            }
            #mobile-controls {
                display: flex;
                flex-direction: column;
                justify-content: center;
                height: 30vh;
                flex: 0 0 30vh;
                width: 100%;
                padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
                background: #123c1d;
                border-top: 3px solid rgba(255,255,255,0.14);
                z-index: 10;
            }
            #controls {
                left: 8px;
                right: 8px;
                bottom: calc(30vh + 8px);
                transform: none;
                gap: 6px;
                padding: 6px;
            }
            #controls button, #controls select {
                padding: 7px 8px;
                font-size: 12px;
            }
            #start-message {
                top: 48%;
                font-size: clamp(15px, 4vw, 22px);
                width: min(88%, 520px);
            }
            #game-over {
                top: 48%;
                font-size: clamp(24px, 7vw, 38px);
            }
            #score-display, #highscore-display {
                top: 10px;
                font-size: clamp(14px, 4vw, 20px);
            }
        }
        @media (max-width: 520px) {
            #controls { width: calc(100% - 20px); }
            #controls button, #controls select { padding: 7px 8px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game-area">
            <canvas id="game-canvas"></canvas>
            <div id="score-display">Score: 0</div>
            <div id="highscore-display">High Score: 0</div>
            <div id="game-over">Game Over<br><span id="final-score"></span><br>Press Space / Tap Play to Restart</div>
            <div id="start-message">Press an arrow key or tap an arrow to start<br>Use keyboard, swipe, or arrow buttons<br>Mobile audio starts after your first tap</div>
        </div>
        <div id="controls">
            <button id="play-pause-btn">Play</button>
            <select id="game-speed" aria-label="Speed">
                <option value="150">Slow</option>
                <option value="100" selected>Normal</option>
                <option value="60">Speed</option>
            </select>
            <button id="music-btn">Music On</button>
            <button id="fullscreen-btn">Full Screen</button>
        </div>
        <div id="mobile-controls" aria-label="Mobile controls">
            <div class="dpad">
                <button class="mobile-up" data-dir="up" aria-label="Move up">▲</button>
                <button class="mobile-left" data-dir="left" aria-label="Move left">◀</button>
                <button class="mobile-center" id="mobile-play-pause" aria-label="Play or pause">Play</button>
                <button class="mobile-right" data-dir="right" aria-label="Move right">▶</button>
                <button class="mobile-down" data-dir="down" aria-label="Move down">▼</button>
            </div>
            <div class="mobile-action-row">
                <button id="mobile-restart-btn">Restart</button>
                <button id="mobile-music-btn">Music On</button>
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto"><source src="music/Snake Game Music/gameplay.mp3" type="audio/mpeg"></audio>
    <audio id="eatSound" preload="auto"><source src="music/Snake Game Music/apple-eat.mp3" type="audio/mpeg"></audio>
    <audio id="gameOverSound" preload="auto"><source src="music/Snake Game Music/game-over.mp3" type="audio/mpeg"></audio>
    <audio id="startSound" preload="auto"><source src="music/Snake Game Music/game-start.mp3" type="audio/mpeg"></audio>

<script>
        const container = document.getElementById('game-container');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const highscoreDisplay = document.getElementById('highscore-display');
        const gameOverDisplay = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const startMessage = document.getElementById('start-message');
        const speedSelector = document.getElementById('game-speed');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const musicBtn = document.getElementById('music-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const mobileControls = document.getElementById('mobile-controls');
        const mobilePlayPauseBtn = document.getElementById('mobile-play-pause');
        const mobileRestartBtn = document.getElementById('mobile-restart-btn');
        const mobileMusicBtn = document.getElementById('mobile-music-btn');
        const bgMusic = document.getElementById('bgMusic');
        const eatSound = document.getElementById('eatSound');
        const gameOverSound = document.getElementById('gameOverSound');
        const startSound = document.getElementById('startSound');

        const GRID_SIZE = 20;
        let GRID_WIDTH = 40;
        let GRID_HEIGHT = 30;
        let snake = [];
        let food = {};
        let direction = '';
        let nextDirection = '';
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let gamePaused = false;
        let gameSpeed = 100;
        let gameLoop;
        let musicOn = true;
        let grassBlades = [];

        bgMusic.volume = 0.35;
        eatSound.volume = 0.8;
        gameOverSound.volume = 0.8;
        startSound.volume = 0.75;

        const audioFiles = [
            {name: 'Gameplay Music', element: bgMusic, file: 'gameplay.mp3'},
            {name: 'Apple Eat Sound', element: eatSound, file: 'apple-eat.mp3'},
            {name: 'Game Over Sound', element: gameOverSound, file: 'game-over.mp3'},
            {name: 'Game Start Sound', element: startSound, file: 'game-start.mp3'}
        ];
        const audioFolders = [
            'music/Snake Game Music/',
            './music/Snake Game Music/',
            'Music/Snake Game Music/',
            './Music/Snake Game Music/'
        ];
        let audioUnlocked = false;

        audioFiles.forEach(item => {
            item.pathIndex = 0;
            item.path = audioFolders[item.pathIndex] + item.file;
            item.element.src = encodeURI(item.path);
            item.element.load();
            item.element.addEventListener('error', () => {
                item.pathIndex += 1;
                if (item.pathIndex < audioFolders.length) {
                    item.path = audioFolders[item.pathIndex] + item.file;
                    item.element.src = encodeURI(item.path);
                    item.element.load();
                } else {
                    console.error(item.name + ' not found or cannot be played. Keep the HTML beside the music folder. Tried:', audioFolders.map(f => f + item.file));
                }
            });
        });

        function unlockAudio() {
            if (audioUnlocked) return;
            audioUnlocked = true;
            audioFiles.forEach(item => {
                item.element.load();
            });
            if (musicOn && gameRunning && !gamePaused) playBackgroundMusic();
        }

        highscoreDisplay.innerText = `High Score: ${highScore}`;

        function resizeCanvas() {
            const gameArea = document.getElementById('game-area');
            const bounds = gameArea.getBoundingClientRect();
            const w = Math.floor(bounds.width / GRID_SIZE) * GRID_SIZE;
            const h = Math.floor(bounds.height / GRID_SIZE) * GRID_SIZE;
            canvas.width = Math.max(w, 300);
            canvas.height = Math.max(h, 220);
            GRID_WIDTH = canvas.width / GRID_SIZE;
            GRID_HEIGHT = canvas.height / GRID_SIZE;
            makeGrass();
            if (snake.length) {
                snake = snake.map(s => ({x: Math.min(s.x, GRID_WIDTH - 1), y: Math.min(s.y, GRID_HEIGHT - 1)}));
                if (food.x >= GRID_WIDTH || food.y >= GRID_HEIGHT) placeFood();
            }
            draw();
        }

        function makeGrass() {
            grassBlades = [];
            const count = Math.floor((canvas.width * canvas.height) / 7000);
            for (let i = 0; i < count; i++) {
                grassBlades.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    len: 5 + Math.random() * 10,
                    bend: -2 + Math.random() * 4
                });
            }
        }

        function playSound(audio) {
            if (!musicOn || !audio) return;
            try { audio.currentTime = 0; } catch (e) {}
            audio.play().catch(() => {});
        }
        function playBackgroundMusic() {
            if (!musicOn) return;
            bgMusic.play().catch(() => {});
        }
        function stopAllMusic() {
            [bgMusic, eatSound, gameOverSound, startSound].forEach(a => { a.pause(); a.currentTime = 0; });
        }
        function updateMusicButton() {
            musicBtn.innerText = musicOn ? 'Music On' : 'Music Off';
            mobileMusicBtn.innerText = musicOn ? 'Music On' : 'Music Off';
        }

        function initGame() {
            clearInterval(gameLoop);
            snake = [{x: Math.floor(GRID_WIDTH / 2), y: Math.floor(GRID_HEIGHT / 2)}];
            direction = '';
            nextDirection = '';
            score = 0;
            scoreDisplay.innerText = 'Score: 0';
            gameOverDisplay.style.display = 'none';
            startMessage.style.display = 'block';
            gameRunning = false;
            gamePaused = false;
            playPauseBtn.innerText = 'Play';
            mobilePlayPauseBtn.innerText = 'Play';
            placeFood();
            draw();
        }

        function placeFood() {
            let validPosition = false;
            while (!validPosition) {
                food = {x: Math.floor(Math.random() * GRID_WIDTH), y: Math.floor(Math.random() * GRID_HEIGHT)};
                validPosition = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
        }

        function drawGround() {
            ctx.fillStyle = '#3f8f36';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(20, 95, 20, 0.45)';
            ctx.lineWidth = 1;
            for (const g of grassBlades) {
                ctx.beginPath();
                ctx.moveTo(g.x, g.y);
                ctx.quadraticCurveTo(g.x + g.bend, g.y - g.len / 2, g.x + g.bend * 2, g.y - g.len);
                ctx.stroke();
            }
        }

        function draw() {
            drawGround();
            for (let i = 0; i < snake.length; i++) {
                const greenValue = Math.floor(170 - (i * 3));
                ctx.fillStyle = `rgb(0, ${Math.max(greenValue, 60)}, 0)`;
                const segment = snake[i];
                const x = segment.x * GRID_SIZE;
                const y = segment.y * GRID_SIZE;
                ctx.beginPath();
                ctx.roundRect(x, y, GRID_SIZE, GRID_SIZE, 6);
                ctx.fill();
                if (i < snake.length - 1) {
                    const nextSegment = snake[i + 1];
                    ctx.strokeStyle = `rgb(0, ${Math.max(greenValue, 60)}, 0)`;
                    ctx.lineWidth = GRID_SIZE / 2;
                    ctx.beginPath();
                    ctx.moveTo(x + GRID_SIZE / 2, y + GRID_SIZE / 2);
                    ctx.lineTo(nextSegment.x * GRID_SIZE + GRID_SIZE / 2, nextSegment.y * GRID_SIZE + GRID_SIZE / 2);
                    ctx.stroke();
                }
                if (i === 0) drawEyes();
            }
            drawApple();
            if (gamePaused && gameRunning) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.48)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '36px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
                ctx.font = '22px Arial';
                ctx.fillText('Press P or Play to resume', canvas.width / 2, canvas.height / 2 + 38);
            }
        }

        function drawEyes() {
            ctx.fillStyle = 'white';
            const eyeSize = GRID_SIZE / 5;
            let leftEyeX, leftEyeY, rightEyeX, rightEyeY;
            switch(direction) {
                case 'up': leftEyeX = snake[0].x*GRID_SIZE+GRID_SIZE/4; leftEyeY = snake[0].y*GRID_SIZE+GRID_SIZE/4; rightEyeX = snake[0].x*GRID_SIZE+3*GRID_SIZE/4; rightEyeY = snake[0].y*GRID_SIZE+GRID_SIZE/4; break;
                case 'down': leftEyeX = snake[0].x*GRID_SIZE+GRID_SIZE/4; leftEyeY = snake[0].y*GRID_SIZE+3*GRID_SIZE/4; rightEyeX = snake[0].x*GRID_SIZE+3*GRID_SIZE/4; rightEyeY = snake[0].y*GRID_SIZE+3*GRID_SIZE/4; break;
                case 'left': leftEyeX = snake[0].x*GRID_SIZE+GRID_SIZE/4; leftEyeY = snake[0].y*GRID_SIZE+GRID_SIZE/4; rightEyeX = snake[0].x*GRID_SIZE+GRID_SIZE/4; rightEyeY = snake[0].y*GRID_SIZE+3*GRID_SIZE/4; break;
                default: leftEyeX = snake[0].x*GRID_SIZE+3*GRID_SIZE/4; leftEyeY = snake[0].y*GRID_SIZE+GRID_SIZE/4; rightEyeX = snake[0].x*GRID_SIZE+3*GRID_SIZE/4; rightEyeY = snake[0].y*GRID_SIZE+3*GRID_SIZE/4;
            }
            ctx.beginPath(); ctx.arc(leftEyeX, leftEyeY, eyeSize, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(rightEyeX, rightEyeY, eyeSize, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(leftEyeX, leftEyeY, eyeSize/2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(rightEyeX, rightEyeY, eyeSize/2, 0, Math.PI*2); ctx.fill();
        }

        function drawApple() {
            ctx.fillStyle = '#ff0000';
            const foodX = food.x * GRID_SIZE + GRID_SIZE / 2;
            const foodY = food.y * GRID_SIZE + GRID_SIZE / 2;
            const radius = GRID_SIZE / 2 - 2;
            ctx.beginPath(); ctx.arc(foodX, foodY, radius, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#125c17';
            ctx.beginPath(); ctx.ellipse(foodX + 2, foodY - radius + 2, 4, 2, Math.PI / 4, 0, Math.PI * 2); ctx.fill();
        }

        function update() {
            if (!gameRunning || gamePaused) return;
            if (nextDirection) { direction = nextDirection; nextDirection = ''; }
            if (!direction) return;
            const head = {x: snake[0].x, y: snake[0].y};
            if (direction === 'up') head.y--; else if (direction === 'down') head.y++; else if (direction === 'left') head.x--; else if (direction === 'right') head.x++;
            if (head.x < 0 || head.x >= GRID_WIDTH || head.y < 0 || head.y >= GRID_HEIGHT || snake.some(segment => segment.x === head.x && segment.y === head.y)) { gameOver(); return; }
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreDisplay.innerText = `Score: ${score}`;
                playSound(eatSound);
                if (score > highScore) { highScore = score; highscoreDisplay.innerText = `High Score: ${highScore}`; localStorage.setItem('snakeHighScore', highScore); }
                placeFood();
            } else {
                snake.pop();
            }
            draw();
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            bgMusic.pause();
            playSound(gameOverSound);
            finalScoreDisplay.innerText = `Final Score: ${score}`;
            gameOverDisplay.style.display = 'block';
            playPauseBtn.innerText = 'Play';
            mobilePlayPauseBtn.innerText = 'Play';
        }

        function startGame() {
            if (gameOverDisplay.style.display === 'block') initGame();
            if (gameRunning) return;
            gameRunning = true;
            gamePaused = false;
            startMessage.style.display = 'none';
            gameSpeed = parseInt(speedSelector.value, 10);
            playPauseBtn.innerText = 'Pause';
            mobilePlayPauseBtn.innerText = 'Pause';
            playSound(startSound);
            playBackgroundMusic();
            clearInterval(gameLoop);
            gameLoop = setInterval(update, gameSpeed);
        }

        function togglePause() {
            if (!gameRunning) { startGame(); return; }
            gamePaused = !gamePaused;
            playPauseBtn.innerText = gamePaused ? 'Play' : 'Pause';
            mobilePlayPauseBtn.innerText = gamePaused ? 'Play' : 'Pause';
            if (gamePaused) bgMusic.pause(); else playBackgroundMusic();
            draw();
        }

        function toggleMusic() {
            musicOn = !musicOn;
            updateMusicButton();
            if (!musicOn) stopAllMusic(); else if (gameRunning && !gamePaused) playBackgroundMusic();
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function setSnakeDirection(newDirection) {
            if (!gameRunning) startGame();
            if (gamePaused) return;
            if (newDirection === 'up' && direction !== 'down') nextDirection = 'up';
            if (newDirection === 'down' && direction !== 'up') nextDirection = 'down';
            if (newDirection === 'left' && direction !== 'right') nextDirection = 'left';
            if (newDirection === 'right' && direction !== 'left') nextDirection = 'right';
        }

        document.querySelectorAll('#mobile-controls [data-dir]').forEach(button => {
            button.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                unlockAudio();
                setSnakeDirection(button.dataset.dir);
            });
        });

        let touchStartX = 0;
        let touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            unlockAudio();
            const t = e.changedTouches[0];
            touchStartX = t.clientX;
            touchStartY = t.clientY;
            e.preventDefault();
        }, {passive: false});
        canvas.addEventListener('touchend', (e) => {
            const t = e.changedTouches[0];
            const dx = t.clientX - touchStartX;
            const dy = t.clientY - touchStartY;
            if (Math.max(Math.abs(dx), Math.abs(dy)) > 22) {
                setSnakeDirection(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
            }
            e.preventDefault();
        }, {passive: false});

        document.addEventListener('pointerdown', unlockAudio, {once: true});
        document.addEventListener('click', unlockAudio, {once: true});

        document.addEventListener('keydown', function(e) {
            if (e.key === 'f' || e.key === 'F') { toggleFullScreen(); e.preventDefault(); return; }
            if (e.key === 'p' || e.key === 'P') { togglePause(); e.preventDefault(); return; }
            if (e.key === ' ' && gameOverDisplay.style.display === 'block') { initGame(); startGame(); e.preventDefault(); return; }
            switch (e.key) {
                case 'ArrowUp': setSnakeDirection('up'); e.preventDefault(); break;
                case 'ArrowDown': setSnakeDirection('down'); e.preventDefault(); break;
                case 'ArrowLeft': setSnakeDirection('left'); e.preventDefault(); break;
                case 'ArrowRight': setSnakeDirection('right'); e.preventDefault(); break;
            }
        });

        speedSelector.addEventListener('change', function() {
            gameSpeed = parseInt(speedSelector.value, 10);
            if (gameRunning) { clearInterval(gameLoop); gameLoop = setInterval(update, gameSpeed); }
        });
        playPauseBtn.addEventListener('click', () => { unlockAudio(); togglePause(); });
        mobilePlayPauseBtn.addEventListener('click', () => { unlockAudio(); togglePause(); });
        mobileRestartBtn.addEventListener('click', () => { initGame(); });
        musicBtn.addEventListener('click', () => { unlockAudio(); toggleMusic(); });
        mobileMusicBtn.addEventListener('click', () => { unlockAudio(); toggleMusic(); });
        fullscreenBtn.addEventListener('click', toggleFullScreen);
        window.addEventListener('resize', resizeCanvas);
        document.addEventListener('fullscreenchange', () => setTimeout(resizeCanvas, 120));

        resizeCanvas();
        updateMusicButton();
        initGame();
    </script>
</body>
</html>
