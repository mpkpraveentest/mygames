<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon - Racing Theme</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050505;
    font-family:Arial, Helvetica, sans-serif;
    position:relative;
}
.track{
    position:absolute;
    inset:0;
    background:
      repeating-linear-gradient(
        90deg,
        transparent 0 80px,
        rgba(255,255,255,.15) 80px 100px
      );
    animation:road 1s linear infinite;
    opacity:.25;
}
@keyframes road{
    from{transform:translateX(0)}
    to{transform:translateX(-100px)}
}
.text{
    font-size:clamp(4rem,12vw,10rem);
    font-weight:900;
    letter-spacing:10px;
    text-transform:uppercase;
    color:#fff;
    text-align:center;
    text-shadow:
      0 0 10px #ff0055,
      0 0 25px #ff0055,
      0 0 50px #00d9ff;
    animation:zoom 2s ease-in-out infinite alternate;
    z-index:2;
}
.speedline{
    position:absolute;
    height:4px;
    background:linear-gradient(90deg,#ff0055,#00d9ff);
    animation:speed 2s linear infinite;
    opacity:.8;
}
@keyframes speed{
    from{transform:translateX(-120vw)}
    to{transform:translateX(120vw)}
}
@keyframes zoom{
    from{transform:scale(1)}
    to{transform:scale(1.08)}
}
</style>
</head>
<body>
<div class="track"></div>

<div class="speedline" style="top:20%;width:300px;"></div>
<div class="speedline" style="top:35%;width:500px;animation-delay:.4s"></div>
<div class="speedline" style="top:60%;width:400px;animation-delay:.8s"></div>
<div class="speedline" style="top:75%;width:600px;animation-delay:1.2s"></div>

<div class="text">COMING SOON</div>
</body>
</html>
